[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phigraph-causal"
version = "4.1.0-rc.5"
description = "Governed relational intelligence, evidence and verification platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Walter Calmels"}]
keywords = ["governed-ai", "agent-verification", "graph-intelligence", "evidence-ledger"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "networkx>=3.0",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.2"]
security = ["bandit[toml]>=1.9,<2", "pip-audit>=2.10,<3"]
app = ["streamlit>=1.44", "openpyxl>=3.1"]
benchmark = ["scikit-learn>=1.4"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
hav = []
postgres = ["psycopg[binary]>=3.2"]
observability = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]
auth = ["PyJWT[crypto]>=2.9"]
mvp = ["streamlit>=1.44", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
phigraph = "phigraph.cli:main"
phigraph-web = "phigraph.web_launcher:main"
phigraph-benchmark = "phigraph.benchmark_cli:main"
phigraph-api = "phigraph.deployment.server:main"
phigraph-worker = "phigraph.deployment.worker:main"
phigraph-cyber-mvp = "phigraph.cyber_mvp.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Homepage = "https://phi47.cl"
Repository = "https://github.com/wcalmels/phigraph"
Documentation = "https://docs.phi47.cl"
Issues = "https://github.com/wcalmels/phigraph/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
