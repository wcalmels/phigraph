services:
  cyber-mvp:
    build:
      context: .
      dockerfile: Dockerfile.mvp
    container_name: phigraph-cyber-mvp
    environment:
      PHIGRAPH_SHADOW_ONLY: "true"
      PHIGRAPH_REAL_CONNECTORS_ENABLED: "false"
    ports:
      - "8501:8501"
    volumes:
      - cyber-mvp-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  cyber-mvp-data:
