name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,benchmark,dev,auth,app]"
      - name: Publication audit
        run: python scripts/publication_audit.py
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Verify safe defaults
        run: |
          PHIGRAPH_SHADOW_ONLY=true PHIGRAPH_REAL_CONNECTORS_ENABLED=false \
          python -c "from phigraph.deployment import load_settings; s=load_settings(); assert s.shadow_only and not s.real_connectors_enabled"

  package:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel smoke test
        run: |
          python -m venv /tmp/phigraph-wheel-test
          WHEEL_PATH=$(find dist -maxdepth 1 -name "*.whl" -print -quit)
          test -n "$WHEEL_PATH"
          /tmp/phigraph-wheel-test/bin/pip install "${WHEEL_PATH}[api,benchmark,auth,app]"
          /tmp/phigraph-wheel-test/bin/python -c "from importlib.metadata import version; from packaging.version import Version; import phigraph; from phigraph.version import CORE_VERSION; assert Version(CORE_VERSION) == Version(version('phigraph-causal'))"
      - uses: actions/upload-artifact@v4
        with:
          name: phigraph-distributions
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag phigraph:${{ github.sha }} .
