name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag and package version
        run: |
          python - <<'PY'
          import os, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          with open('pyproject.toml','rb') as f:
              version = tomllib.load(f)['project']['version']
          assert tag == version, (tag, version)
          PY
      - name: Test and build
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[api,benchmark,dev]"
          pytest
          python -m build
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*             --draft             --verify-tag             --title "TUCH PhiGraph Core $GITHUB_REF_NAME"             --notes-file RELEASE_NOTES_V4.0.0.md
