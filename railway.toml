[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway allows at most one preDeployCommand entry (shell string, not argv list).
preDeployCommand = ["python -c \"print('pre-deploy ok')\""]
healthcheckPath = "/health/live"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
