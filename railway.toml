[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No-op overrides stuck UI pre-deploy (npm migrate). Migrations run on API startup.
preDeployCommand = ["python", "-c", "print('pre-deploy ok')"]
healthcheckPath = "/health/live"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
